name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Download verified Stockfish 18 engine for ARM64
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 'https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar' -o /tmp/stockfish.tar
          mkdir -p /tmp/stockfish app/src/main/jniLibs/arm64-v8a
          tar -xf /tmp/stockfish.tar -C /tmp/stockfish
          find /tmp/stockfish -type f | head -30
          SF=$(find /tmp/stockfish -type f -name 'stockfish-android-armv8' | head -1)
          test -n "$SF"
          cp "$SF" app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libstockfish.so
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Master-BG-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
